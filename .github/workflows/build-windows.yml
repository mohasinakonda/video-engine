name: Build & Release (Windows)

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
  # Auto-trigger on version tags
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Download FFmpeg for Windows sidecar
        shell: pwsh
        run: |
          $FFMPEG_VERSION = "7.1.1"
          $URL = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-${FFMPEG_VERSION}-essentials_build.zip"
          $BINARIES_DIR = "src-tauri/binaries"
          $TEMP_DIR = ".ffmpeg-temp"
          $OUTPUT = "$BINARIES_DIR/ffmpeg-x86_64-pc-windows-msvc.exe"

          New-Item -ItemType Directory -Force -Path $BINARIES_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $TEMP_DIR | Out-Null

          Write-Host "Downloading FFmpeg ${FFMPEG_VERSION}..."
          try {
            Invoke-WebRequest -Uri $URL -OutFile "$TEMP_DIR/ffmpeg.zip" -UseBasicParsing
          } catch {
            $FALLBACK = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            Write-Host "Primary failed, trying fallback..."
            Invoke-WebRequest -Uri $FALLBACK -OutFile "$TEMP_DIR/ffmpeg.zip" -UseBasicParsing
          }

          Expand-Archive -Path "$TEMP_DIR/ffmpeg.zip" -DestinationPath "$TEMP_DIR/extracted" -Force
          $exe = Get-ChildItem -Path "$TEMP_DIR/extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          
          if (-not $exe) {
            Write-Error "ffmpeg.exe not found!"
            exit 1
          }

          Copy-Item $exe.FullName -Destination $OUTPUT -Force
          Write-Host "FFmpeg ready: $OUTPUT ($('{0:N1}' -f ((Get-Item $OUTPUT).Length / 1MB)) MB)"
          
          Remove-Item -Path $TEMP_DIR -Recurse -Force

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Creates a GitHub Release with the built artifacts
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Video Studio ${{ github.ref_name }}'
          releaseBody: 'Download the .msi installer below to install AI Video Studio with FFmpeg bundled.'
          releaseDraft: true
          prerelease: false

      # If not a tag push (manual trigger), just upload as artifact
      - name: Upload build artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-studio-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
